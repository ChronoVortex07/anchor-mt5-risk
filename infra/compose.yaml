name: mt5-risk-dev
x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}
services:
  postgres:
    image: postgres:17-bookworm@sha256:84560e3b9c6874893fc4e2854f5dc3e7c1a37bc9d1dfd7a8c641310ae22ba5ad
    restart: unless-stopped
    environment:
      POSTGRES_DB: risk
      POSTGRES_USER: risk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U risk -d risk"]
      interval: 5s
      timeout: 3s
      retries: 15
    logging: *logging
    security_opt: [no-new-privileges:true]
    networks: [private]
  backend:
    image: mt5-risk:${RISK_IMAGE_TAG:-0.1.0}
    build: {context: .., dockerfile: backend/Dockerfile}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://risk:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/risk
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      PUBLIC_URL: ${PUBLIC_URL:-https://localhost}
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5
    ports: ["127.0.0.1:${DEV_PORT:-18089}:8080"]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *logging
    networks: [private]
volumes:
  postgres-data:
networks:
  private:
